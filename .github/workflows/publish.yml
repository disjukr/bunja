name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Set npm and JSR versions from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm version:release "$RELEASE_TAG"
      - run: pnpm check
      - name: Validate JSR package
        run: pnpm exec jsr publish --dry-run --allow-dirty
        working-directory: ./bunja
      - name: Publish to npm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=${RELEASE_TAG#v}
          NPM_TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=${VERSION#*-}
            NPM_TAG=${NPM_TAG%%.*}
          fi
          npm publish --provenance --access public --registry https://registry.npmjs.org --tag "$NPM_TAG"
        working-directory: ./bunja
      - name: Publish to JSR
        run: pnpm exec jsr publish --allow-dirty
        working-directory: ./bunja
