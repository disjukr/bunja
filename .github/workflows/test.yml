name: Test

on:
  pull_request:
  push:
    branches: [main, v4]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check supported Node runtimes with packed consumer
        run: |
          for VERSION in 22.18.0 24.22.2; do
            mise install "node@$VERSION"
            BUNJA_COMPAT_NODE="$(mise where "node@$VERSION")/bin/node" pnpm check:package
          done
