name: Test

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile
      - name: Install minimum supported Node runtime
        run: mise install node@22.18.0
      - name: Check workspace and package
        run: BUNJA_COMPAT_NODE="$(mise where node@22.18.0)/bin/node" pnpm check
